<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17132d">
<title>派对不许怂｜多人真心话大冒险</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f3fb;color:#241b35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:14px}
.hero,.stage{background:#211832;color:#fff;border-radius:22px;padding:18px}
.hero h1{margin:0;font-size:23px}
.muted{color:#c8b9dc;font-size:12px}
.panel{background:#fff;border-radius:18px;padding:16px;margin-top:12px}
.panel h2{font-size:17px;margin:0 0 12px}
.question{min-height:110px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:700;line-height:1.5;padding:12px 0}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
button{border:0;border-radius:12px;padding:13px 9px;font-size:14px;font-weight:700;background:#8e49ae;color:white;margin-top:8px;cursor:pointer}
button.alt{background:#ffe8ef;color:#a9234a}
button.gold{background:#fff0db;color:#944500}
button.green{background:#e4f7eb;color:#207449}
button.active{outline:2px solid #8e49ae}
input,textarea{width:100%;border:1px solid #ded5e9;border-radius:11px;padding:12px;font-size:15px;margin:5px 0}
label{font-size:13px;color:#655773}
.status{background:#f0eaf8;padding:10px;border-radius:10px;font-size:12px;line-height:1.5;margin-top:10px;overflow-wrap:anywhere}
.players{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{background:#eee4f7;border-radius:20px;padding:7px 10px;font-size:12px}
.chip.me{background:#e4f7eb}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.score{background:#3b2d54;padding:10px;border-radius:12px;overflow-wrap:anywhere}
.score small{display:block;color:#ddd0ed}
.score b{font-size:20px}
.history{font-size:13px;border-bottom:1px solid #eee;padding:8px 0;line-height:1.5}
.hint{font-size:12px;line-height:1.6;color:#6c5c7b}
</style>
</head>
<body>
<main class="app">
<header class="hero">
<h1>🎉 派对不许怂</h1>
<div class="muted">TRUTH OR DARE · ONLINE PARTY</div>
<section class="stage" style="margin-top:15px">
<div class="row"><span id="kind">💬 真心话</span><span id="round" style="text-align:right">第 0 轮</span></div>
<div class="question" id="question">创建房间或加入朋友的房间！</div>
<div class="muted" id="turn">等待玩家加入</div>
<div class="scores" id="scores" style="margin-top:12px"></div>
</section>
</header>

<section class="panel">
<h2>🌐 多人房间（2–8 人）</h2>
<label>你的昵称</label>
<input id="name" maxlength="20" placeholder="输入昵称，例如：小明">
<div class="row">
<button id="create">创建新房间</button>
<button class="alt" id="join">加入房间</button>
</div>
<label>房间码（邀请链接会自动填写）</label>
<input id="room" maxlength="8" placeholder="例如 ABC123" autocapitalize="characters">
<button id="share" style="width:100%">🔗 复制邀请链接</button>
<div id="status" class="status">尚未连接。创建房间后，把邀请链接发给朋友即可。</div>
<div id="players" class="players"></div>
</section>

<section class="panel">
<h2>01 · 选择游戏难度</h2>
<div class="row">
<button class="level active" data-level="轻松">😆 轻松搞笑</button>
<button class="level" data-level="心动">💗 心动暧昧</button>
<button class="level" data-level="刺激">🔥 刺激进阶</button>
</div>
<h2 style="margin-top:20px">02 · 抽取挑战</h2>
<div class="row">
<button class="alt" id="truth">💬 真心话</button>
<button class="gold" id="dare">⚡ 大冒险</button>
</div>
<button id="again" style="width:100%">🔀 再抽一题</button>
<div class="row">
<button class="alt" id="next">换下一位</button>
<button class="gold" id="skip">跳过本题</button>
</div>
<button class="green" id="complete" style="width:100%">✓ 完成挑战，获得 1 分</button>
</section>

<section class="panel">
<h2>03 · 自定义题目</h2>
<textarea id="custom" rows="3" placeholder="例如：说出你最想和大家一起去的地方。"></textarea>
<button id="useCustom" style="width:100%">使用这道题</button>
<button class="alt" id="reset" style="width:100%">重新开局</button>
</section>

<section class="panel">
<h2>最近抽取</h2>
<div id="history"></div>
</section>

<p class="hint">🛡️ 友善规则：不想回答可以跳过，不强迫喝酒、不做危险挑战、不公开他人隐私。此原型通过 Supabase Realtime 公共频道同步游戏；知道房间码或链接的人可能加入，请勿分享敏感信息。</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://pfqqiowlurzjhlrnzgve.supabase.co";
const SB_KEY="sb_publishable_rMVpLmBT1yoRNZ4Uhxf7LA_TgFfy3dO";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const uid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"u"+Math.random().toString(36).slice(2)+Date.now();

const deck=[
["真心话","轻松","你做过最社死的一件事是什么？"],
["真心话","轻松","如果你的手机会说话，它会吐槽你什么？"],
["真心话","轻松","你最奇怪的一个小习惯是什么？"],
["真心话","轻松","你最近一次撒的小谎是什么？"],
["真心话","轻松","如果必须卸载一个常用 App，你会删哪个？"],
["真心话","轻松","你小时候相信过最离谱的事情是什么？"],
["真心话","心动","什么小细节最容易让你对一个人心动？"],
["真心话","心动","你理想中的约会是什么样的？"],
["真心话","心动","你最希望对方主动为你做的一件小事是什么？"],
["真心话","刺激","你最害怕别人发现自己的哪个小缺点？"],
["真心话","刺激","你最想改变自己的一件事是什么？"],
["真心话","刺激","说一件你一直想尝试却没鼓起勇气做的事。"],
["大冒险","轻松","模仿一种动物 10 秒，让大家猜是什么。"],
["大冒险","轻松","用播音腔介绍自己，仿佛你是刚上市的爆款产品。"],
["大冒险","轻松","用夸张的广告语推销桌上的一件物品。"],
["大冒险","心动","认真说出一个你欣赏对方的地方。"],
["大冒险","心动","用偶像剧语气说一句普通的日常用语。"],
["大冒险","心动","给对方设计一个专属昵称，并解释原因。"],
["大冒险","刺激","即兴表演一段 15 秒的获奖感言。"],
["大冒险","刺激","用三种不同情绪说出“晚饭吃什么”。"],
["大冒险","刺激","用夸张的慢动作完成一个简单动作，比如挥手。"]
];

let room="",ch=null,online=false,people={},level="轻松";
let game={
round:0,kind:"真心话",q:"创建房间或加入朋友的房间！",
turn:null,scores:{},hist:[],level:"轻松",updated:0
};

function name(){
return $("name").value.trim().slice(0,20)||"玩家";
}
function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function status(s){
$("status").textContent=s;
}

function render(){
$("kind").textContent=game.kind==="大冒险"?"⚡ 大冒险":game.kind==="自定义"?"✍️ 自定义题目":"💬 真心话";
$("round").textContent="第 "+game.round+" 轮";
$("question").textContent=game.q;
$("turn").textContent=people[game.turn]?"轮到："+people[game.turn].name:(Object.keys(people).length?"请玩家选择挑战":"等待玩家加入");
$("players").innerHTML=Object.values(people).map(p=>`<span class="chip ${p.id===uid?"me":""}">${esc(p.name)}${p.id===uid?"（你）":""}</span>`).join("");
$("scores").innerHTML=Object.values(people).map(p=>`<div class="score"><small>${esc(p.name)}</small><b>${Number(game.scores[p.id]||0)} 分</b></div>`).join("");
$("history").innerHTML=game.hist.map(h=>`<div class="history">${esc(h.k)} · ${esc(h.q)}<br><span class="muted">— ${esc(h.by||"玩家")}</span></div>`).join("")||'<span class="hint">还没有抽题记录。</span>';
}

async function send(event,payload){
if(ch&&online){
await ch.send({type:"broadcast",event,payload:{...payload,from:uid,by:name(),at:Date.now()}});
}
}
async function publish(){
game.updated=Date.now();
await send("state",{game:JSON.parse(JSON.stringify(game))});
}

function act(a,by){
if(a.type==="draw"){
let pool=deck.filter(x=>x[0]===a.kind&&x[1]===a.level);
if(!pool.length)pool=deck.filter(x=>x[0]===a.kind);
const q=pool[Math.floor(Math.random()*pool.length)];
game.kind=q[0];game.level=a.level;game.q=q[2];game.round++;
if(!game.turn)game.turn=Object.keys(people)[0]||uid;
game.hist.unshift({k:q[0],q:q[2],by:by||"玩家"});
game.hist=game.hist.slice(0,8);
}else if(a.type==="next"||a.type==="skip"){
const ids=Object.keys(people);
if(ids.length){
let i=ids.indexOf(game.turn);
game.turn=ids[(i+1+ids.length)%ids.length];
}
game.q=a.type==="next"?"换人啦！请当前玩家选择真心话或大冒险。":"已跳过这题。没有压力，继续快乐游戏！";
}else if(a.type==="complete"){
const who=game.turn||uid;
game.scores[who]=(game.scores[who]||0)+1;
game.q=(people[who]?.name||"当前玩家")+" 挑战完成，获得 1 分 🎉";
}else if(a.type==="custom"){
game.kind="自定义";game.level=a.level;game.q=a.q;game.round++;
game.hist.unshift({k:"自定义",q:a.q,by:by||"玩家"});
game.hist=game.hist.slice(0,8);
}else if(a.type==="reset"){
game={
round:0,kind:"真心话",
q:"新的一局开始啦！请选择真心话或大冒险。",
turn:Object.keys(people)[0]||uid,
scores:{},hist:[],level:"轻松",updated:Date.now()
};
}
render();
}

async function doAction(a){
if(!online){
alert("请先创建或加入房间。");
return;
}
act(a,name());
await publish();
}

async function connect(code){
if(ch){
try{await sb.removeChannel(ch);}catch(e){}
}
room=code.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(!room){
alert("请输入房间码。");
return;
}
$("room").value=room;
history.replaceState({},"",location.pathname+"?room="+encodeURIComponent(room));
people={};online=false;
status("正在连接房间 "+room+"…");

ch=sb.channel("party-room-"+room,{
config:{presence:{key:uid},broadcast:{self:false}}
});

ch.on("presence",{event:"sync"},()=>{
const next={};
Object.values(ch.presenceState()).flat().forEach(p=>{
if(p&&p.id)next[p.id]=p;
});
people=next;
const ids=Object.keys(people);
if(!game.turn&&ids.length)game.turn=ids[0];
render();
status("房间 "+room+" · "+ids.length+"/8 人在线");
});

ch.on("broadcast",{event:"state"},({payload})=>{
if(payload&&payload.from!==uid&&payload.game&&Number(payload.game.updated||payload.at||0)>=Number(game.updated||0)){
game=payload.game;
render();
}
});

ch.on("broadcast",{event:"request"},async({payload})=>{
if(payload&&payload.from!==uid){
await send("state",{game:JSON.parse(JSON.stringify(game))});
}
});

await new Promise(resolve=>{
let finished=false;
ch.subscribe(async s=>{
if(s==="SUBSCRIBED"&&!finished){
finished=true;online=true;
await ch.track({id:uid,name:name(),joinedAt:Date.now()});
await send("request",{});
resolve(true);
}else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(s)&&!finished){
finished=true;
status("连接失败："+s+"。请检查网络和 Supabase 配置。");
resolve(false);
}
});
});

if(online)status("已连接房间 "+room+"。复制邀请链接发给朋友。");
}

$("create").onclick=async()=>{
const code=Math.random().toString(36).slice(2,8).toUpperCase();
await connect(code);
if(online){
game.turn=uid;
game.scores[uid]=0;
await publish();
status("房间 "+room+" 已创建。点击复制邀请链接发给朋友。");
}
};

$("join").onclick=async()=>{
const code=$("room").value.trim();
if(!code){
alert("请填写房间码，或直接打开朋友发来的邀请链接。");
return;
}
if(Object.keys(people).length>=8&&!people[uid]){
alert("房间可能已满，请让房主确认。");
return;
}
await connect(code);
if(online){
if(!game.turn)game.turn=uid;
game.scores[uid]=game.scores[uid]||0;
await publish();
status("已加入房间 "+room+"。请和朋友使用同一个房间链接。");
}
};

$("share").onclick=async()=>{
if(!room){
alert("请先创建或加入房间。");
return;
}
const link=new URL(location.href);
link.searchParams.set("room",room);
try{
await navigator.clipboard.writeText(link.href);
status("邀请链接已复制："+link.href);
}catch(e){
prompt("复制邀请链接发送给朋友：",link.href);
}
};

document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{
level=b.dataset.level;
document.querySelectorAll(".level").forEach(x=>x.classList.toggle("active",x===b));
game.level=level;
});

$("truth").onclick=()=>doAction({type:"draw",kind:"真心话",level});
$("dare").onclick=()=>doAction({type:"draw",kind:"大冒险",level});
$("again").onclick=()=>doAction({type:"draw",kind:game.kind==="大冒险"?"大冒险":"真心话",level});
$("next").onclick=()=>doAction({type:"next"});
$("skip").onclick=()=>doAction({type:"skip"});
$("complete").onclick=()=>doAction({type:"complete"});

$("useCustom").onclick=()=>{
const q=$("custom").value.trim();
if(!q){
alert("请先写下题目。");
return;
}
doAction({type:"custom",q,level});
$("custom").value="";
};

$("reset").onclick=()=>{
if(confirm("确定清空本局分数和记录吗？"))doAction({type:"reset"});
};

$("name").addEventListener("change",async()=>{
if(ch&&online){
await ch.track({id:uid,name:name(),joinedAt:Date.now()});
status("昵称已更新。");
}
});

render();
const invite=new URLSearchParams(location.search).get("room");
if(invite){
$("room").value=invite;
$("question").textContent="检测到邀请链接。输入昵称后点击“加入房间”。";
}
</script>
</body>
</html>
